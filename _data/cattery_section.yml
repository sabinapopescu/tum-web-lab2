cattery_heading: "Наш питомник"
cattery_intro: "В питомнике Ragdoll Dreams мы занимаемся разведением здоровых, отлично социализированных котят рэгдолл с исключительным характером. Наши кошки происходят из чемпионских линий и растут у нас дома как полноценные члены семьи."

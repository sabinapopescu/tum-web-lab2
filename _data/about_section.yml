about_heading: "Почему стоит выбрать рэгдолла?"
about_features:
  - icon: heart
    title: "Нежные гиганты"
    body: "Рэгдоллы известны своим спокойным, ласковым темпераментом. Они буквально «обмякают» на руках, отсюда и название «Ragdoll» — «тряпичная кукла»."
  - icon: eye
    title: "Потрясающие голубые глаза"
    body: "У всех чистокровных рэгдоллов завораживающие голубые глаза, которые покоряют каждого, кто на них смотрит."
  - icon: star
    title: "Шёлковая шерсть"
    body: "Их полудлинная, шёлковая шерсть требует минимум ухода и представлена в красивых пойнтовых окрасах."
  - icon: home
    title: "Идеальные компаньоны"
    body: "Идеальны для семей: они терпеливы с детьми и прекрасно уживаются с другими животными."

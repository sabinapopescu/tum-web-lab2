# About the Breed Section
about_heading: "Почему стоит выбрать рэгдолла?"
about_features:
  - icon: heart
    title: "Нежные гиганты"
    body: "Рэгдоллы известны своим спокойным, ласковым темпераментом. Они буквально «обмякают» на руках, отсюда и название «Ragdoll» — «тряпичная кукла»."
  - icon: eye
    title: "Потрясающие голубые глаза"
    body: "У всех чистокровных рэгдоллов завораживающие голубые глаза, которые покоряют каждого, кто на них смотрит."
  - icon: star
    title: "Шёлковая шерсть"
    body: "Их полудлинная, шёлковая шерсть требует минимум ухода и представлена в красивых пойнтовых окрасах."
  - icon: home
    title: "Идеальные компаньоны"
    body: "Идеальны для семей: они терпеливы с детьми и прекрасно уживаются с другими животными."

# Kittens Section
kittens_heading: "Доступные котята рэгдолл"
kittens_intro: "Познакомьтесь с нашими текущими и будущими помётами красивых, здоровых котят рэгдолл. Все котята продаются с ветеринарными сертификатами, регистрационными документами и пожизненной поддержкой заводчика."

# Cattery Section
cattery_heading: "Наш питомник"
cattery_intro: "В питомнике Ragdoll Dreams мы занимаемся разведением здоровых, отлично социализированных котят рэгдолл с исключительным характером. Наши кошки происходят из чемпионских линий и растут у нас дома как полноценные члены семьи."
cattery_image: "assets/images/catery.jpg"
cattery_quality_heading: "Наши приоритеты качества:"
cattery_commitments:
  - "Полное обследование здоровья на HCM, PKD и другие генетические маркеры"
  - "Котята растут «под ногами» в домашней обстановке и получают обширную социализацию"
  - "Гарантия здоровья и официальные регистрационные документы"
  - "Пожизненная поддержка заводчика для всех семей наших котят"
  - "Регулярное ветеринарное обслуживание и прививки по возрасту"
  - "Премиальное питание и развивающие игры и занятия"

